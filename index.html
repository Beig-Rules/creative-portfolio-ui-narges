<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نرگس — طراح UI</title>
<style>:root{--bg:#fff;--text:#111;--muted:#666;--accent:#000;--border:#e5e5e5;--card:#fafafa}[data-theme=dark]{--bg:#0a0a0a;--text:#f5f5f5;--muted:#aaa;--accent:#fff;--border:#2a2a2a;--card:#141414}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:var(--bg);color:var(--text)}.c{max-width:900px;margin:0 auto;padding:0 20px}.hero{padding:100px 0;text-align:center}h1{font-size:3rem;font-weight:800;letter-spacing:-1px}.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;padding:40px 0}.proj{background:var(--card);border:1px solid var(--border);height:180px;border-radius:8px;display:flex;align-items:flex-end;padding:16px;font-weight:600}footer{text-align:center;padding:40px;color:var(--muted)}</style></head>
<body><header style="padding:20px 0;border-bottom:1px solid var(--border)"><div class="c" style="display:flex;justify-content:space-between"><strong>نرگس</strong><button onclick="document.documentElement.toggleAttribute('data-theme')" style="background:transparent;border:1px solid var(--border);padding:6px 10px">تم</button></div></header>
<section class="hero c"><h1>طراح UI<br>مینیمال و دقیق</h1><p style="color:var(--muted);margin-top:16px">واجه‌های وب و موبایل با تمرکز بر وضوح و تبدیل.</p></section>
<section class="c"><h2>پروژه‌ها</h2><div class="projects">
<div class="proj">اپ مالی</div><div class="proj">لندینگ SaaS</div><div class="proj">داشبورد</div>
</div></section>
<footer>تماس: narges@design.ir — © ۱۴۰۵</footer></body></html>
